<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Margin Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky working header (client + tabs) over one wide work surface; every analysis view leads with its summary, then the detail table. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #eaf0ee;
  --ink: #13201e;
  --muted: #566764;
  --line: #d6dfdc;
  --accent: #1d6a64;
  --accent-ink: #ffffff;
  --accent-soft: #d9ece9;
  --series-1: #2a78d6;
  --over: #e34948;
  --under: #2a78d6;
  --mid: #e2e6e4;
  --good: #0a7d0a;
  --warn: #9a6200;
  --warn-bg: #fdf0d3;
  --crit: #c03535;
  --crit-bg: #fbe2e0;
  --good-bg: #dff1df;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #161f1e; --surface-2: #1d2827; --ink: #e5eeec; --muted: #9aaca8;
    --line: #2b3836; --accent: #4fb0a6; --accent-ink: #08201d; --accent-soft: #1d3633;
    --series-1: #3987e5; --over: #e66767; --under: #3987e5; --mid: #2c3533;
    --good: #46c046; --warn: #f0b440; --warn-bg: #3a2e12; --crit: #ef7a7a; --crit-bg: #3d1e1e; --good-bg: #173219;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #161f1e; --surface-2: #1d2827; --ink: #e5eeec; --muted: #9aaca8;
  --line: #2b3836; --accent: #4fb0a6; --accent-ink: #08201d; --accent-soft: #1d3633;
  --series-1: #3987e5; --over: #e66767; --under: #3987e5; --mid: #2c3533;
  --good: #46c046; --warn: #f0b440; --warn-bg: #3a2e12; --crit: #ef7a7a; --crit-bg: #3d1e1e; --good-bg: #173219;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.num, td.n, th.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 12px 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 21px; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.client { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.client img { height: 30px; width: auto; max-width: 96px; object-fit: contain; border-radius: 4px; }
.logo-box { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.logo-box .ph { width: 120px; height: 72px; border: 1.5px dashed var(--line); border-radius: var(--r); display: grid; place-items: center; color: var(--muted); font-size: 12px; background: var(--surface-2); overflow: hidden; }
.logo-box .ph img { max-width: 100%; max-height: 100%; object-fit: contain; }
.prepared { display: flex; gap: 14px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.prepared img { height: 44px; width: auto; max-width: 160px; object-fit: contain; }
.prepared small { display: block; color: var(--muted); font-size: 12px; }
.client label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
select, input[type=text], input[type=number], input[type=date], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0;
}
select { padding-right: 24px; }
textarea { width: 100%; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-weight: 500; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.crit { color: var(--crit); background: var(--crit-bg); }
.pill.plain::before { display: none; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tabs a { padding: 9px 10px 10px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .sep { width: 1px; background: var(--line); margin: 8px 6px; flex: none; }

main { padding-block: 24px 64px; display: grid; gap: 20px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px 24px; flex-wrap: wrap; }
.head p { color: var(--muted); max-width: 68ch; margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.panel > header p { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.demo-note { background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kpi .val { font-family: var(--f-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .sub { font-size: 12px; color: var(--muted); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; white-space: nowrap; }
td.muted, .muted { color: var(--muted); }
tr.flag td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
td input[type=number] { width: 88px; text-align: right; font-family: var(--f-mono); padding: 4px 6px; }
td input[type=text] { width: 100%; min-width: 140px; padding: 4px 6px; }
td select { max-width: 240px; padding: 4px 22px 4px 6px; }
tfoot td { font-weight: 700; background: var(--surface-2); }

.div-bar { position: relative; width: 120px; height: 12px; }
.div-bar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; }
.div-bar i { position: absolute; top: 1px; height: 10px; border-radius: 0 3px 3px 0; }
.div-bar i.over { left: 50%; background: var(--over); }
.div-bar i.under { right: 50%; background: var(--under); border-radius: 3px 0 0 3px; }

.tickets { display: grid; gap: 10px; }
.ticket { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.ticket .rank { font-family: var(--f-display); font-size: 20px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.ticket .body { display: grid; gap: 4px; min-width: 0; }
.ticket .body h3 { font-size: 15px; }
.ticket .body p { color: var(--muted); font-size: 13px; }
.ticket .body .act { color: var(--ink); }
.ticket .amt { text-align: right; }
.ticket .amt b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.ticket .amt small { color: var(--muted); font-size: 11px; }
.ticket .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
@media (max-width: 560px) { .ticket { grid-template-columns: 26px minmax(0, 1fr); } .ticket .amt { grid-column: 2; text-align: left; } }

.review { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.review ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.review li { display: grid; gap: 2px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); font-size: 13px; }
.review li:last-child { border-bottom: 0; padding-bottom: 0; }
.review li span { color: var(--muted); font-size: 12px; }

.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px 18px; }
.field { display: grid; gap: 4px; align-content: start; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field small { color: var(--muted); font-size: 12px; }
.field input, .field select { width: 100%; }

.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.subtabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.subtabs .count { font-family: var(--f-mono); font-size: 11px; margin-left: 4px; opacity: .8; }

.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; justify-items: start; background: var(--surface-2); }
.drop.over { border-color: var(--accent); }
.maprow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px 14px; }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.chart .lbl-strong { fill: var(--ink); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 14px rgb(0 0 0 / .18); white-space: pre-line; }

.conn { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.conn .panel h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.conn dl { margin: 0; display: grid; gap: 8px; font-size: 13px; }
.conn dt { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.conn dd { margin: 0; }
.readout-text { min-height: 360px; font-family: var(--f-body); line-height: 1.6; padding: 14px; }
.empty { padding: 28px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: min(420px, calc(100vw - 32px)); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--crit-bg); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.recipe { border: 1px solid var(--line); border-radius: var(--r); }
.recipe summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
.recipe summary b { margin-right: auto; }
.recipe .inner { padding: 0 14px 14px; display: grid; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>Margin Desk</h1><span>Food cost consulting</span></div>
      <div class="client">
        <img id="clientLogo" alt="" hidden>
        <label for="clientSel">Client</label>
        <select id="clientSel" aria-label="Choose client"></select>
        <button class="btn" id="newClientBtn" type="button">New client</button>
        <span id="saveState" class="pill">Demo</span>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
  </div>
</div>
<div class="wrap"><main id="main"></main></div>
<div id="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/[$,%\s]/g, "")); return Number.isFinite(n) ? n : null; };
const fmt = (n, d = 0) => n == null || !Number.isFinite(n) ? "–" : n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (n, d = 0) => n == null || !Number.isFinite(n) ? "–" : (n < 0 ? "−$" : "$") + fmt(Math.abs(n), d);
const signedMoney = n => n == null ? "–" : (n > 0 ? "+" : "") + money(n);
const pct = (n, d = 1) => n == null || !Number.isFinite(n) ? "–" : fmt(n * 100, d) + "%";
const uid = p => p + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3600); }

/* ---------- system catalog ---------- */
const SYSTEMS = {
  pos: {
    "Toast": { gives: "Item-level sales with modifiers, voids, comps, discounts, dayparts and revenue centers; full menu configuration.", access: "Standard API access is self-service for restaurant operators. The Orders and Menus APIs cover what Margin Desk needs. Analytics API access comes with Toast's higher tiers; productized integrations go through Toast's partner program.", first: true },
    "Square": { gives: "Orders with line items and modifiers, catalog items and variations, discounts, locations.", access: "Open developer platform. Each client authorizes with OAuth; Orders and Catalog APIs." },
    "Clover": { gives: "Orders, line items, modifiers, discounts, item catalog per merchant.", access: "Developer platform with a REST API. A merchant installs your app; distribution requires Clover app approval." },
    "Lightspeed": { gives: "Sales receipts, menu items, modifiers and floors/revenue centers.", access: "Developer program with OAuth API access for Lightspeed Restaurant." },
    "Other / export only": { gives: "Item sales report: item name, quantity sold, net sales.", access: "Import a product-mix or item sales CSV for each period." }
  },
  purchasing: {
    "MarginEdge": { gives: "Invoice line items with vendor, product, pack size, unit price, credits; product and category lists.", access: "Public API. Keys are issued from MarginEdge's developer portal for authorized parties.", first: true },
    "xtraCHEF (Toast)": { gives: "Invoice line items, vendor items, recipe costing.", access: "Part of Toast. Access runs through Toast's integration channels; confirm what your client's plan exposes." },
    "Restaurant365": { gives: "AP invoices, vendor items, GL coding, inventory counts.", access: "API and data access typically enabled per customer by Restaurant365." },
    "Direct distributor invoices": { gives: "Sysco, US Foods, GFS: invoice lines with SKU, pack, price.", access: "Usually EDI or CSV exports from the distributor's portal rather than an open API. Invoice photos can be read by an AI model as a fallback." },
    "Other / export only": { gives: "Invoice line export: date, vendor, description, quantity, pack, price.", access: "Import a CSV for each period." }
  },
  accounting: {
    "QuickBooks Online": { gives: "Profit and loss by period, with food and beverage sales and COGS accounts.", access: "Accounting API with OAuth. Pull the P&L report for the count period." },
    "Xero": { gives: "Profit and loss by period and tracking category.", access: "Accounting API with OAuth. Pull the P&L report for the count period." },
    "Restaurant365": { gives: "GL and P&L by location and period.", access: "Enabled per customer by Restaurant365." },
    "Other / manual": { gives: "Food sales and food COGS for the period.", access: "Type the two numbers into Client setup." }
  }
};

/* ---------- import field definitions ---------- */
const DATASETS = {
  sales: { label: "POS item sales", fields: [
    { k: "item", label: "Menu item (POS name)", req: true, syn: ["item", "menu item", "item name", "name", "product", "menu item name", "description", "selection"] },
    { k: "qty", label: "Quantity sold", req: true, syn: ["qty", "quantity", "qty sold", "item qty", "count", "sold", "units", "number sold"] },
    { k: "revenue", label: "Net sales $", req: false, syn: ["net sales", "sales", "revenue", "net amount", "amount", "net", "gross sales", "total"] } ] },
  invoices: { label: "Invoice lines", fields: [
    { k: "date", label: "Invoice date", req: false, syn: ["date", "invoice date", "inv date", "delivery date"] },
    { k: "vendor", label: "Vendor", req: false, syn: ["vendor", "supplier", "distributor", "vendor name"] },
    { k: "desc", label: "Item description", req: true, syn: ["description", "item", "product", "item description", "product name", "vendor item"] },
    { k: "qty", label: "Packs received", req: true, syn: ["qty", "quantity", "cases", "qty shipped", "shipped", "units", "received"] },
    { k: "packUnits", label: "Units per pack", req: false, syn: ["pack units", "units per pack", "pack", "pack size", "each per case", "case size"] },
    { k: "packCost", label: "Cost per pack $", req: true, syn: ["price", "unit price", "case price", "cost", "pack price", "price per case"] } ] },
  counts: { label: "Inventory counts", fields: [
    { k: "ingredient", label: "Ingredient", req: true, syn: ["ingredient", "item", "product", "name", "description"] },
    { k: "begin", label: "Beginning count", req: false, syn: ["beginning", "begin", "beginning count", "opening", "start", "bop"] },
    { k: "end", label: "Ending count", req: false, syn: ["ending", "end", "ending count", "closing", "on hand", "eop"] },
    { k: "waste", label: "Waste", req: false, syn: ["waste", "spoilage", "waste qty", "loss"] },
    { k: "transfer", label: "Transfers out", req: false, syn: ["transfer", "transfers", "transfer out", "transfers out"] } ] },
  recipes: { label: "Recipe lines", fields: [
    { k: "recipe", label: "Recipe / menu item", req: true, syn: ["recipe", "menu item", "item", "dish", "recipe name"] },
    { k: "price", label: "Menu price $", req: false, syn: ["price", "menu price", "sell price", "selling price"] },
    { k: "ingredient", label: "Ingredient", req: true, syn: ["ingredient", "component", "ingredient name"] },
    { k: "qty", label: "Quantity (ingredient units)", req: true, syn: ["qty", "quantity", "amount", "portion"] },
    { k: "unit", label: "Unit", req: false, syn: ["unit", "uom", "units"] } ] },
  hourly: { label: "Hourly sales & labor", fields: [
    { k: "hour", label: "Hour of day (0–23)", req: true, syn: ["hour", "hour of day", "time", "interval", "time period", "hr"] },
    { k: "sales", label: "Net sales $", req: true, syn: ["net sales", "sales", "revenue", "net amount", "total sales"] },

/* ---------- analysis engine ---------- */
function analyze(ws) {
  const S = ws.setup, af = 365 / Math.max(1, num(S.periodDays) || 28), target = (num(S.target) || 30) / 100, thr = (num(S.threshold) || 5) / 100;
  const ingById = Object.fromEntries(ws.ingredients.map(i => [i.id, i]));
  // purchasing
  const buy = {};
  const sortedInv = [...ws.invoices].sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let unmappedInv = {};
  for (const l of sortedInv) {
    const ing = ws.vendorMap[l.desc];
    const pu = num(l.packUnits) || 1, pc = num(l.packCost), q = num(l.qty) || 0;
    if (!ing || !ingById[ing]) { const u = unmappedInv[l.desc] ||= { desc: l.desc, vendor: l.vendor, spend: 0 }; u.spend += q * (pc || 0); continue; }
    const b = buy[ing] ||= { units: 0, spend: 0, first: null, latest: null, firstDate: null, latestDate: null, noPack: false };
    b.units += q * pu; b.spend += q * (pc || 0);
    if (!num(l.packUnits)) b.noPack = true;
    if (pc != null) { const uc = pc / pu; if (b.first == null) { b.first = uc; b.firstDate = l.date; } b.latest = uc; b.latestDate = l.date; }
  }
  const cost = id => buy[id]?.latest ?? num(ingById[id]?.cost) ?? 0;
  const recById = Object.fromEntries(ws.recipes.map(r => [r.id, r]));
  const plateCost = r => r.lines.reduce((s, l) => s + (num(l.qty) || 0) * cost(l.ing), 0) / ((num(r.yieldPct) || 100) / 100);
  // sales
  const soldBy = {}; let sales = 0, mappedSales = 0; const unmappedPos = [];
  const posAgg = {};
  for (const s of ws.sales) { const a = posAgg[s.item] ||= { item: s.item, qty: 0, revenue: 0 }; a.qty += num(s.qty) || 0; a.revenue += num(s.revenue) || 0; }
  for (const a of Object.values(posAgg)) {
    sales += a.revenue;
    const r = ws.posMap[a.item];
    if (r === "__skip") continue;
    if (!r || !recById[r]) { unmappedPos.push(a); continue; }
    const t = soldBy[r] ||= { qty: 0, revenue: 0 }; t.qty += a.qty; t.revenue += a.revenue; mappedSales += a.revenue;
  }
  // theoretical usage per ingredient
  const theo = {}, users = {};
  for (const r of ws.recipes) {
    const q = soldBy[r.id]?.qty || 0; if (!q) continue;
    const y = (num(r.yieldPct) || 100) / 100;
    for (const l of r.lines) { const u = q * (num(l.qty) || 0) / y; theo[l.ing] = (theo[l.ing] || 0) + u; (users[l.ing] ||= []).push({ name: r.name, units: u }); }
  }
  // consumption rows
  const rows = ws.ingredients.map(i => {
    const c = ws.counts[i.id] || {}, b = buy[i.id];
    const begin = num(c.begin), end = num(c.end), waste = num(c.waste) || 0, transfer = num(c.transfer) || 0;
    const purchased = b?.units || 0, t = theo[i.id] || 0, uc = cost(i.id);
    const counted = begin != null && end != null;
    const actual = counted ? begin + purchased - end - transfer : null;
    const variance = counted ? actual - t - waste : null;
    const vPct = counted && t > 0 ? variance / t : null;
    const flag = vPct != null && Math.abs(vPct) > thr;
    return { ing: i, begin, end, waste, transfer, purchased, theo: t, actual, variance, vPct, vDollar: variance == null ? null : variance * uc, wasteDollar: waste * uc, cost: uc, counted, flag,
      users: (users[i.id] || []).sort((a, b) => b.units - a.units), buy: b };
  });
  // menu items
  const items = ws.recipes.map(r => {
    const pc = plateCost(r), price = num(r.price), s = soldBy[r.id] || { qty: 0, revenue: 0 };
    return { r, plate: pc, price, qty: s.qty, revenue: s.revenue, cm: price != null ? price - pc : null, fc: price ? pc / price : null };
  });
  const menu = items.filter(x => x.qty > 0 && x.price && x.r.cat !== "Modifier");
  const totQ = menu.reduce((s, x) => s + x.qty, 0);
  const avgCM = totQ ? menu.reduce((s, x) => s + x.cm * x.qty, 0) / totQ : 0;
  const popCut = menu.length ? 0.7 / menu.length : 0;
  for (const x of menu) {
    x.mix = x.qty / totQ;
    const hp = x.mix >= popCut, hm = x.cm >= avgCM;
    x.quad = hp && hm ? "Star" : hp ? "Plowhorse" : hm ? "Puzzle" : "Dog";
  }
  // food cost
  const theoCOGS = items.reduce((s, x) => s + x.plate * x.qty, 0);
  let actualCOGS = 0, uncountedSpend = 0;
  for (const row of rows) { if (row.counted) actualCOGS += row.actual * row.cost; else if (row.buy) { actualCOGS += row.buy.spend; uncountedSpend += row.buy.spend; } }
  const pS = num(ws.pnl?.foodSales), pC = num(ws.pnl?.foodCOGS);
  const fc = { sales, mappedSales, theoCOGS, actualCOGS, theoPct: mappedSales ? theoCOGS / mappedSales : null, actualPct: mappedSales ? actualCOGS / mappedSales : null,
    pnlPct: pS && pC != null ? pC / pS : null, target, uncountedSpend };

  // opportunities
  const opps = [];
  const MIN = 150;
  for (const row of rows) {
    if (row.flag && row.variance > 0 && row.vDollar * af >= MIN) {
      const top = row.users.slice(0, 2).map(u => u.name);
      opps.push({ type: "Usage overage", title: `${row.ing.name}: ${fmt(row.variance, 1)} ${row.ing.unit} over theoretical`, value: row.vDollar * af, period: row.vDollar,
        detail: `Actual use ran ${pct(row.vPct)} above recipe-based use after logged waste.` + (top.length ? ` Biggest users: ${top.join(" and ")}.` : ""),
        action: "Spot-check portions on the line, re-weigh the spec, and recount before the next period." });
    }
  }
  for (const row of rows) {
    if (row.wasteDollar * af >= MIN * 2) {
      opps.push({ type: "Waste", title: `${row.ing.name}: ${fmt(row.waste, 1)} ${row.ing.unit} logged as waste`, value: row.wasteDollar * af * 0.5, period: row.wasteDollar * 0.5,
        detail: `${money(row.wasteDollar)} wasted this period. Value shown assumes waste is cut in half.`,
        action: "Tighten par levels and order frequency; review prep batch sizes and FIFO." });
    }
  }
  for (const x of items) {
    if (x.fc != null && x.qty > 0 && x.fc > target + 0.03) {
      const np = Math.ceil((x.plate / target) * 2) / 2;
      const capped = Math.min(np, Math.ceil(x.price * 1.12 * 2) / 2);
      const gain = (capped - x.price) * x.qty;
      if (gain * af >= MIN) opps.push({ type: "Underpriced plate", title: `${x.r.name}: ${pct(x.fc)} plate cost vs ${pct(target, 0)} target`, value: gain * af, period: gain,
        detail: `Plate costs ${money(x.plate, 2)} at the latest invoice prices on a ${money(x.price, 2)} menu price. A price of ${money(capped, 2)} brings it to ${pct(x.plate / capped)}` + (capped < np ? ` (capped at a 12% increase; the full fix is ${money(np, 2)}).` : "."),
        action: "Reprice, or re-spec the plate (portion, garnish, side) to bring cost down. Value assumes volume holds." });
    }
  }
  for (const row of rows) {
    const b = row.buy;
    if (b && b.first && b.latest && b.latest > b.first * 1.05) {
      const imp = (b.latest - b.first) * b.units;
      if (imp * af >= MIN) {
        const aff = row.users.map(u => u.name).slice(0, 3);
        opps.push({ type: "Vendor price increase", title: `${row.ing.name}: up ${pct(b.latest / b.first - 1)} since ${b.firstDate}`, value: imp * af, period: imp,
          detail: `Unit cost moved from ${money(b.first, 2)} to ${money(b.latest, 2)} per ${row.ing.unit}.` + (aff.length ? ` Affects ${aff.join(", ")}.` : ""),
          action: "Ask for a price lock or contract pricing, get a competing bid, or adjust the affected plates." });
      }
    }
  }
  // hourly productivity
  const days = Math.max(1, num(S.periodDays) || 28), splhT = num(S.splhTarget) || 50, minStaff = num(S.minStaff) ?? 3;
  const hourAgg = {};
  for (const r of ws.hourly || []) { const k = num(r.hour); if (k == null) continue; const a = hourAgg[k] ||= { hour: k, sales: 0, guests: 0, hours: 0, cost: 0 }; a.sales += num(r.sales) || 0; a.guests += num(r.guests) || 0; a.hours += num(r.hours) || 0; a.cost += num(r.cost) || 0; }
  const hours = Object.values(hourAgg).sort((a, b) => a.hour - b.hour);
  const L = hours.reduce((t, x) => ({ sales: t.sales + x.sales, guests: t.guests + x.guests, hours: t.hours + x.hours, cost: t.cost + x.cost }), { sales: 0, guests: 0, hours: 0, cost: 0 });
  const wage = L.hours ? L.cost / L.hours : 0;
  for (const x of hours) {
    x.splh = x.hours ? x.sales / x.hours : null;
    x.need = Math.max(x.sales / splhT, minStaff * days);
    x.excess = Math.max(0, x.hours - x.need);
    x.low = x.splh != null && x.splh < splhT * 0.85 && x.excess > 0;
  }
  const totalSales = num(ws.pnl?.totalSales) || L.sales || sales;
  const labor = { hours, total: L, wage, splh: L.hours ? L.sales / L.hours : null, laborPct: L.cost && totalSales ? L.cost / totalSales : null,
    guestsPerHour: L.hours ? L.guests / L.hours : null, avgCheck: L.guests ? L.sales / L.guests : null, target: splhT, totalSales };
  const cogsForPrime = num(ws.pnl?.totalCOGS) ?? (actualCOGS || null);
  labor.primePct = L.cost && totalSales && cogsForPrime != null ? (cogsForPrime + L.cost) / totalSales : null;
  // group consecutive low-productivity hours into one ticket each
  let run = [];
  const flush = () => {
    if (!run.length) return;
    const ex = run.reduce((s, x) => s + x.excess, 0), val = ex * wage, sl = run.reduce((s, x) => s + x.sales, 0) / run.reduce((s, x) => s + x.hours, 0);
    if (val * af >= MIN) opps.push({ type: "Labor scheduling", title: `${hourLabel(run[0].hour)}–${hourLabel(run[run.length - 1].hour + 1)}: ${money(sl)} sales per labor hour vs ${money(splhT)} target`,
      value: val * af, period: val, detail: `About ${fmt(ex / days, 1)} more labor hours a day than sales support in this window, keeping a floor of ${fmt(minStaff, 0)} on the clock.`,
      action: "Stagger shift starts and send-home times; cross-train so one person covers two stations in this window." });
    run = [];
  };
  for (const x of hours) { if (x.low) run.push(x); else flush(); }
  flush();
  opps.sort((a, b) => b.value - a.value);

  const review = {
    dogs: menu.filter(x => x.quad === "Dog"), puzzles: menu.filter(x => x.quad === "Puzzle"),
    gaps: []
  };
  for (const u of unmappedPos.sort((a, b) => b.revenue - a.revenue)) review.gaps.push({ t: `POS item "${u.item}" has no recipe`, d: `${money(u.revenue)} in sales are left out of theoretical cost.` });
  for (const u of Object.values(unmappedInv).sort((a, b) => b.spend - a.spend)) review.gaps.push({ t: `Invoice item "${u.desc}" is not mapped`, d: `${money(u.spend)} of purchases are not tied to an ingredient.` });
  for (const row of rows) if (row.theo > 0 && !row.counted) review.gaps.push({ t: `${row.ing.name} has no count`, d: "Add beginning and ending counts to measure actual usage." });
  for (const row of rows) if (row.buy?.noPack) review.gaps.push({ t: `${row.ing.name}: invoice lines missing units per pack`, d: "Purchases are counted as 1 unit per pack until this is set." });
  for (const x of items) if (x.price == null) review.gaps.push({ t: `${x.r.name} has no menu price`, d: "Needed for plate cost % and margin." });
  if (fc.pnlPct == null) review.gaps.push({ t: "No P&L numbers for this period", d: "Add food sales and food COGS in Client setup to compare with the P&L." });
  if (!hours.length) review.gaps.push({ t: "No hourly sales & labor", d: "Import the POS labor-by-hour report to measure productivity." });

  // benchmarks
  const seg = BENCH_SEGMENTS[S.segment] || BENCH_SEGMENTS["Full-service casual"];
  const wasteTot = rows.reduce((s, r) => s + r.wasteDollar, 0);
  const val = {
    foodPct: fc.actualPct != null ? fc.actualPct * 100 : null,
    gapPts: fc.actualPct != null && fc.theoPct != null ? (fc.actualPct - fc.theoPct) * 100 : null,
    laborPct: labor.laborPct != null ? labor.laborPct * 100 : null,
    primePct: labor.primePct != null ? labor.primePct * 100 : null,
    splh: labor.splh, wastePct: actualCOGS ? wasteTot / actualCOGS * 100 : null
  };
  const dollarBase = { foodPct: mappedSales, gapPts: mappedSales, laborPct: totalSales, primePct: totalSales, wastePct: actualCOGS };
  const bench = BENCH_METRICS.map(m => {
    const o = ws.bench?.[m.k] || {}, typ = num(o.typ) ?? seg[m.k][0], top = num(o.top) ?? seg[m.k][1], v = val[m.k];
    let status = null, gap$ = null;
    if (v != null) {
      const better = (a, b) => m.dir < 0 ? a <= b : a >= b;
      status = better(v, top) ? "top" : better(v, typ) ? "typical" : "behind";
      if (!better(v, top)) gap$ = m.k === "splh" ? (L.hours - L.sales / top) * wage * af : (v - top) / 100 * (dollarBase[m.k] || 0) * af;
    }
    return { ...m, v, typ, top, status, gap$, custom: o.typ != null || o.top != null };
  });

  return { rows, items, menu, avgCM, popCut, fc, opps, review, af, unmappedPos, unmappedInv, posAgg, cost, plateCost, ingById, recById, target, thr, labor, bench };
}

const DEMO_ID = "demo";

// Standalone mode: opened as a plain file outside Claude, workspaces are kept in this browser only.
const LOCAL_KEY = "margin-desk-clients";
let localMode = false;
function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(clients)); return true; } catch { return false; } }
function loadLocal() { try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); for (const id in d) clients[id] = upgrade(d[id]); } catch {} }

function touch() {
  if (currentId === DEMO_ID) { renderSaveState(); return; }
  if (localMode) { clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveError = !saveLocal(); renderSaveState(); }, 400); return; }
  if (!db) { renderSaveState(); return; }
  dirty = true; renderSaveState();
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 800);
}
async function saveNow() {
  clearTimeout(saveTimer);
  if (!db || currentId === DEMO_ID || !dirty) return;
  if (saving) { pendingSave = true; return; }
  const id = currentId, data = clone(clients[id]);
  saving = true; dirty = false; renderSaveState();
  try { await db.doc("clients/" + id).set(data); lastSavedJSON[id] = JSON.stringify(data); saveError = false; }
  catch (e) {
    saveError = true; dirty = true;
    toast(e?.code === "quota_exceeded" ? "This workspace is full. Remove old invoice or sales rows, then try again." : e?.code === "invalid_argument" ? "You can view this workspace but not change it." : "Couldn't save. Your changes are kept in this view; we'll retry on your next edit.");
  }
  saving = false; renderSaveState();
  if (pendingSave) { pendingSave = false; dirty = true; saveNow(); }
}
function renderSaveState() {
  const el = $("#saveState");
  if (currentId === DEMO_ID) { el.className = "pill"; el.textContent = "Demo · edits not saved"; return; }
  if (localMode) { el.className = saveError ? "pill crit" : "pill ok"; el.textContent = saveError ? "Not saved" : "Saved in this browser"; return; }
  if (!db) { el.className = "pill warn"; el.textContent = "Not saving · this view only"; return; }
  if (saveError) { el.className = "pill crit"; el.textContent = "Not saved"; return; }
  if (saving || dirty) { el.className = "pill"; el.textContent = "Saving…"; return; }
  el.className = "pill ok"; el.textContent = "Saved";
}

    ${w.recipes.length ? w.recipes.map(r => {

      return `<details class="recipe" ${r._open ? "open" : ""} data-rid="${h(r.id)}"><summary><b>${h(r.name)}</b><span class="muted">${h(r.cat || "")}</span><span class="num">${money(pc, 2)} cost</span><span class="num">${p ? pct(pc / p) : "no price"}</span></summary>
      <div class="inner"><div class="form">
        <div class="field"><label>Name</label><input type="text" data-rf="name" value="${h(r.name)}"></div>
        <div class="field"><label>Menu price $</label><input type="number" step="0.25" data-rf="price" value="${h(r.price ?? "")}"></div>
        <div class="field"><label>Category</label><input type="text" data-rf="cat" value="${h(r.cat || "")}" placeholder="Entrée, Side, Modifier…"></div>
        <div class="field"><label>Yield %</label><input type="number" data-rf="yieldPct" value="${h(r.yieldPct ?? 100)}"></div>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Ingredient</th><th class="n">Qty</th><th>Unit</th><th class="n">Cost</th><th></th></tr></thead><tbody>
        ${r.lines.map((l, i) => `<tr><td><select data-rl="${i}" data-rlf="ing" aria-label="Ingredient">${ingOptions(w, l.ing, "Choose")}</select></td>
          <td class="n"><input type="number" step="any" data-rl="${i}" data-rlf="qty" value="${h(l.qty)}" aria-label="Quantity"></td>
          <td class="muted">${h(A.ingById[l.ing]?.unit || "")}</td><td class="n">${money((num(l.qty) || 0) * A.cost(l.ing), 2)}</td>
          <td><button class="btn ghost" type="button" data-act="del-line" data-i="${i}" aria-label="Remove line">Remove</button></td></tr>`).join("")}
      </tbody></table></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-act="add-line">Add ingredient</button><button class="btn ghost danger" type="button" data-act="del-recipe">Delete recipe</button></div>
      </div></details>`;
    }).join("") : `<div class="empty"><b>No recipes yet</b><span>Import recipe lines or add the first recipe by hand.</span></div>`}
  </section>`;
}
function dIngredients(w, A) {
  return `<section class="panel"><header><div><h3>Ingredients</h3><p>The count unit is what you count, buy (after units per pack) and portion in. The fallback cost is used only when no invoice is mapped.</p></div><button class="btn" type="button" data-act="add-ing">Add ingredient</button></header>
    <div class="tbl-wrap"><table><thead><tr><th>Ingredient</th><th>Unit</th><th>Category</th><th class="n">Fallback cost</th><th class="n">Latest invoice cost</th><th></th></tr></thead><tbody>
    ${w.ingredients.map(i => `<tr data-iid="${h(i.id)}"><td><input type="text" data-if="name" value="${h(i.name)}" aria-label="Name"></td>
      <td><input type="text" data-if="unit" value="${h(i.unit)}" style="min-width:60px;width:70px" aria-label="Unit"></td>
      <td><input type="text" data-if="cat" value="${h(i.cat || "")}" style="min-width:100px" aria-label="Category"></td>
      <td class="n"><input type="number" step="any" data-if="cost" value="${h(i.cost ?? "")}" aria-label="Fallback cost"></td>
      <td class="n">${A.rows.find(r => r.ing.id === i.id)?.buy?.latest != null ? money(A.cost(i.id), 3) : "–"}</td>
      <td><button class="btn ghost danger" type="button" data-act="del-ing">Remove</button></td></tr>`).join("") || `<tr><td colspan="6" class="muted">No ingredients yet.</td></tr>`}
    </tbody></table></div></section>`;
}

/* --- count sheet --- */
function vCounts(w, A) {
  if (!w.ingredients.length) return head("Count sheet", "") + `<section class="panel"><div class="empty"><b>No ingredients to count yet</b><span>Add ingredients or import recipes first.</span><a class="btn" href="#data">Go to Data & mapping</a></div></section>`;
  const rows = [...A.rows].sort((a, b) => (a.ing.cat || "").localeCompare(b.ing.cat || "") || a.ing.name.localeCompare(b.ing.name));
  const cell = (r, f) => `<td class="n"><input type="number" step="any" inputmode="decimal" data-count="${h(r.ing.id)}" data-cf="${f}" value="${h(w.counts[r.ing.id]?.[f] ?? "")}" aria-label="${f} count for ${h(r.ing.name)}"></td>`;
  return head("Count sheet", `${periodTxt(w)}Type counts in each ingredient's unit. Purchases come from mapped invoices. Actual use = beginning + purchases − ending − transfers out.`) + `
  <div class="tbl-wrap"><table><thead><tr><th>Ingredient</th><th>Unit</th><th class="n">Beginning</th><th class="n">Purchases</th><th class="n">Ending</th><th class="n">Waste</th><th class="n">Transfers out</th><th class="n">Actual use</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${h(r.ing.name)}<div class="muted" style="font-size:11px">${h(r.ing.cat || "")}</div></td><td class="muted">${h(r.ing.unit)}</td>
    ${cell(r, "begin")}<td class="n">${fmt(r.purchased, 1)}</td>${cell(r, "end")}${cell(r, "waste")}${cell(r, "transfer")}
    <td class="n" data-actual="${h(r.ing.id)}">${r.actual == null ? "–" : fmt(r.actual, 1)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* --- consumption --- */
function vConsumption(w, A) {
  const rows = A.rows.filter(r => r.theo > 0 || r.counted || r.purchased);
  if (!rows.length) return head("Consumption", "") + emptyNeeds();
  const flagged = rows.filter(r => r.flag);
  const overD = rows.reduce((s, r) => s + (r.vDollar > 0 ? r.vDollar : 0), 0);
  const netD = rows.reduce((s, r) => s + (r.vDollar || 0), 0);
  const wasteD = rows.reduce((s, r) => s + r.wasteDollar, 0);
  const maxP = Math.max(0.1, ...rows.map(r => Math.abs(r.vPct || 0)));
  const sorted = [...rows].sort((a, b) => (b.vDollar ?? -1e9) - (a.vDollar ?? -1e9));
  return head("Consumption", `${periodTxt(w)}Actual usage from counts and purchases against theoretical usage from units sold × recipe quantity. The variance is what's left after logged waste.`) + `
  <div class="kpis">
    <div class="kpi"><span class="lbl">Unexplained overage</span><span class="val">${money(overD)}</span><span class="sub">${money(overD * A.af)} a year at this rate</span></div>
    <div class="kpi"><span class="lbl">Net variance</span><span class="val">${signedMoney(netD)}</span><span class="sub">Overages minus shortfalls</span></div>
    <div class="kpi"><span class="lbl">Logged waste</span><span class="val">${money(wasteD)}</span><span class="sub">Explained, not in variance</span></div>
    <div class="kpi"><span class="lbl">Flagged ingredients</span><span class="val">${flagged.length}</span><span class="sub">Past ±${fmt(A.thr * 100, 1)}% of theoretical</span></div>
  </div>
  <div class="legend"><span><i style="background:var(--over)"></i>Used more than recipes say</span><span><i style="background:var(--under)"></i>Used less (check counts or portions)</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Ingredient</th><th>Unit</th><th class="n">Theoretical</th><th class="n">Actual</th><th class="n">Waste</th><th class="n">Variance</th><th class="n">Var %</th><th>vs theoretical</th><th class="n">Var $</th><th class="n">Unit cost</th></tr></thead><tbody>
  ${sorted.map(r => {
    const bw = r.vPct == null ? 0 : Math.min(50, Math.abs(r.vPct) / maxP * 50);
    return `<tr class="${r.flag ? "flag" : ""}"><td>${h(r.ing.name)} ${r.flag ? `<span class="pill crit">Flag</span>` : ""}</td><td class="muted">${h(r.ing.unit)}</td>
    <td class="n">${fmt(r.theo, 1)}</td><td class="n">${r.actual == null ? `<span class="muted">no count</span>` : fmt(r.actual, 1)}</td><td class="n">${fmt(r.waste, 1)}</td>
    <td class="n">${r.variance == null ? "–" : (r.variance > 0 ? "+" : "") + fmt(r.variance, 1)}</td><td class="n">${r.vPct == null ? "–" : (r.vPct > 0 ? "+" : "") + pct(r.vPct)}</td>
    <td><div class="div-bar" data-tip="${h(r.ing.name)}\n${r.vPct == null ? "No count" : (r.vPct > 0 ? "+" : "") + pct(r.vPct) + " vs theoretical"}">${r.vPct ? `<i class="${r.vPct > 0 ? "over" : "under"}" style="width:${bw}%"></i>` : ""}</div></td>
    <td class="n">${r.vDollar == null ? "–" : signedMoney(r.vDollar)}</td><td class="n muted">${money(r.cost, 2)}</td></tr>`;
  }).join("")}
  </tbody></table></div>`;
}
function emptyNeeds() {
  return `<section class="panel"><div class="empty"><b>Nothing to analyze yet</b><span>Import POS sales, invoices and recipes, then enter counts. The analysis fills in as each piece arrives.</span><a class="btn primary" href="#data">Go to Data & mapping</a></div></section>`;
}

/* --- opportunities --- */
function vOpps(w, A) {
  const total = A.opps.reduce((s, o) => s + o.value, 0);
  const fc = A.fc;
  const fcState = p => p == null ? "" : p > fc.target + 0.01 ? "crit" : p > fc.target ? "warn" : "ok";
  const kpis = `<div class="kpis">
    <div class="kpi"><span class="lbl">Annual opportunity</span><span class="val">${money(total)}</span><span class="sub">${A.opps.length} ranked tickets below</span></div>
    <div class="kpi"><span class="lbl">Actual food cost</span><span class="val">${pct(fc.actualPct)}</span><span class="sub"><span class="pill ${fcState(fc.actualPct)}">Target ${pct(fc.target, 0)}</span></span></div>
    <div class="kpi"><span class="lbl">Theoretical food cost</span><span class="val">${pct(fc.theoPct)}</span><span class="sub">Gap ${fc.actualPct != null && fc.theoPct != null ? fmt((fc.actualPct - fc.theoPct) * 100, 1) + " pts" : "–"}</span></div>
    <div class="kpi"><span class="lbl">Data gaps</span><span class="val">${A.review.gaps.length}</span><span class="sub">${A.review.gaps.length ? "Listed in the review list" : "Nothing missing"}</span></div>
  </div>`;
  const tagClass = { "Usage overage": "crit", "Waste": "warn", "Underpriced plate": "plain", "Vendor price increase": "warn", "Labor scheduling": "plain" };
  const tickets = A.opps.length ? `<div class="tickets">${A.opps.map((o, i) => `<article class="ticket"><span class="rank">${i + 1}</span>
    <div class="body"><div class="tags"><span class="pill ${tagClass[o.type]}">${o.type}</span></div><h3>${h(o.title)}</h3><p>${h(o.detail)}</p><p class="act"><b>Next step:</b> ${h(o.action)}</p></div>
    <div class="amt"><b>${money(o.value)}</b><small>a year · ${money(o.period)} this period</small></div></article>`).join("")}</div>`
    : `<section class="panel"><div class="empty"><b>No opportunities found yet</b><span>${w.sales.length ? "Usage, waste, pricing and vendor costs are within range, or counts are still missing." : "Add sales, invoices, recipes and counts to generate tickets."}</span></div></section>`;
  const li = (arr, f) => arr.length ? `<ul>${arr.map(f).join("")}</ul>` : `<p class="muted" style="font-size:13px">None this period.</p>`;
  const review = `<div class="review">
    <section class="panel"><header><h3>Menu dogs</h3><p>Low sales and low margin</p></header>${li(A.review.dogs, x => `<li><b>${h(x.r.name)}</b><span>${fmt(x.qty)} sold · ${money(x.cm, 2)} margin vs ${money(A.avgCM, 2)} avg. Rework, reprice or cut.</span></li>`)}</section>
    <section class="panel"><header><h3>Puzzles to promote</h3><p>High margin, low sales</p></header>${li(A.review.puzzles, x => `<li><b>${h(x.r.name)}</b><span>${money(x.cm, 2)} margin · ${pct(x.mix)} of mix. Feature it: menu placement, server suggestion, special.</span></li>`)}</section>
    <section class="panel"><header><h3>Data gaps</h3><p>Fix these to tighten the numbers</p></header>${li(A.review.gaps.slice(0, 12), g => `<li><b>${h(g.t)}</b><span>${h(g.d)}</span></li>`)}${A.review.gaps.length > 12 ? `<p class="muted">${A.review.gaps.length - 12} more.</p>` : ""}</section>
  </div>`;
  return head("Opportunities", `${periodTxt(w)}Ranked by annualized dollars. Values extrapolate this period to a full year (${fmt(A.af, 1)}×).`, `<button class="btn" type="button" data-act="export">Export CSV</button>`) + kpis + tickets + `<h2 style="font-size:18px;margin-top:8px">Review list</h2>` + review;
}

/* --- menu --- */
function vMenu(w, A) {
  const items = A.items.filter(x => x.price);
  if (!items.length) return head("Menu profitability", "") + emptyNeeds();
  const m = A.menu;
  let chart = "";
  if (m.length >= 2) {
    const W = 680, H = 340, L = 56, R = 20, T = 18, B = 44;
    const xMax = Math.max(A.popCut * 1.6, ...m.map(x => x.mix)) * 1.1, yMax = Math.max(A.avgCM * 1.4, ...m.map(x => x.cm)) * 1.1, yMin = Math.min(0, ...m.map(x => x.cm));
    const X = v => L + v / xMax * (W - L - R), Y = v => T + (1 - (v - yMin) / (yMax - yMin)) * (H - T - B);
    const xt = [], yt = [];
    const xs = xMax > .3 ? .1 : xMax > .15 ? .05 : .02; for (let v = 0; v <= xMax + 1e-9; v += xs) xt.push(v);
    const ys = yMax > 30 ? 10 : yMax > 12 ? 5 : 2; for (let v = Math.ceil(yMin / ys) * ys; v <= yMax; v += ys) yt.push(v);
    chart = `<section class="panel"><header><div><h3>Menu engineering</h3><p>Popularity (share of items sold) against contribution margin. Lines mark 70% of an even share and the sales-weighted average margin.</p></div></header>
    <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Menu engineering scatter" style="min-width:520px">
      ${yt.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">$${v}</text>`).join("")}
      ${xt.map(v => `<text x="${X(v)}" y="${H - B + 18}" text-anchor="middle">${Math.round(v * 100)}%</text>`).join("")}
      <line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <line x1="${X(A.popCut)}" x2="${X(A.popCut)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="4 4"/>
      <line x1="${L}" x2="${W - R}" y1="${Y(A.avgCM)}" y2="${Y(A.avgCM)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
      <text x="${W - R - 4}" y="${T + 12}" text-anchor="end" class="lbl-strong">Stars</text><text x="${L + 6}" y="${T + 12}" class="lbl-strong">Puzzles</text>
      <text x="${W - R - 4}" y="${H - B - 8}" text-anchor="end" class="lbl-strong">Plowhorses</text><text x="${L + 6}" y="${H - B - 8}" class="lbl-strong">Dogs</text>
      <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">Share of items sold</text>
      ${(() => { const boxes = []; return m.map(x => { const cx = X(x.mix), cy = Y(x.cm), lw = x.r.name.length * 6.6 + 10;
        const cands = [[cx < W - 150 ? "start" : "end", cy + 4], [cx < W - 150 ? "start" : "end", cy - 10], [cx < W - 150 ? "start" : "end", cy + 18], [cx < W - 150 ? "end" : "start", cy + 4]];
        let pick = cands[0];
        for (const c of cands) { const x0 = c[0] === "start" ? cx + 9 : cx - 9 - lw, bx = [x0, c[1] - 11, x0 + lw, c[1] + 3];
          if (!boxes.some(b => bx[0] < b[2] && bx[2] > b[0] && bx[1] < b[3] && bx[3] > b[1])) { pick = c; break; } }
        { const x0 = pick[0] === "start" ? cx + 9 : cx - 9 - lw; boxes.push([x0, pick[1] - 11, x0 + lw, pick[1] + 3]); }
        const right = pick[0] === "start", ty = pick[1]; return `<g data-tip="${h(x.r.name)} · ${x.quad}\n${fmt(x.qty)} sold (${pct(x.mix)})\nMargin ${money(x.cm, 2)} · plate ${pct(x.fc)}">
        <circle cx="${cx}" cy="${cy}" r="14" fill="transparent"/><circle cx="${cx}" cy="${cy}" r="5.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>
        <text x="${right ? cx + 9 : cx - 9}" y="${ty}" text-anchor="${right ? "start" : "end"}" class="lbl-strong" style="font-weight:500">${h(x.r.name)}</text></g>`; }).join(""); })()}
    </svg></div></section>`;
  }
  const rows = [...items].sort((a, b) => b.cm * b.qty - a.cm * a.qty);
  return head("Menu profitability", `${periodTxt(w)}Plate costs use the latest invoice price for each ingredient. Modifiers are costed but left out of the quadrants.`) + chart + `
  <div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Quadrant</th><th class="n">Price</th><th class="n">Plate cost</th><th class="n">Plate %</th><th class="n">Margin</th><th class="n">Sold</th><th class="n">Total margin</th></tr></thead><tbody>
  ${rows.map(x => `<tr class="${x.fc > A.target + 0.03 ? "flag" : ""}"><td>${h(x.r.name)}<div class="muted" style="font-size:11px">${h(x.r.cat || "")}</div></td>
    <td>${x.quad ? `<span class="pill plain">${x.quad}</span>` : `<span class="muted">${x.r.cat === "Modifier" ? "Modifier" : "Not sold"}</span>`}</td>
    <td class="n">${money(x.price, 2)}</td><td class="n">${money(x.plate, 2)}</td>
    <td class="n">${x.fc > A.target + 0.03 ? `<span class="pill crit">${pct(x.fc)}</span>` : pct(x.fc)}</td><td class="n">${money(x.cm, 2)}</td><td class="n">${fmt(x.qty)}</td><td class="n">${money(x.cm * x.qty)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* --- food cost --- */
function vFood(w, A) {
  const fc = A.fc;
  const bars = [["Theoretical", fc.theoPct, "Recipes × units sold, at latest invoice prices"], ["Actual", fc.actualPct, "Counts + purchases, from the count sheet"], ["P&L", fc.pnlPct, `From ${w.setup.accounting}`]];
  const W = 640, rowH = 54, L = 110, R = 70, T = 10, H = T + rowH * 3 + 30;
  const max = Math.max(fc.target * 1.4, ...bars.map(b => b[1] || 0)) * 1.08;
  const X = v => L + v / max * (W - L - R);
  const ticks = []; for (let v = 0; v <= max; v += 0.05) ticks.push(v);
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Food cost comparison" style="min-width:440px">
    ${ticks.map(v => `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T + rowH * 3}"/><text x="${X(v)}" y="${T + rowH * 3 + 16}" text-anchor="middle">${Math.round(v * 100)}%</text>`).join("")}
    ${bars.map(([n, v, d], i) => { const y = T + i * rowH + 14; return `<g data-tip="${n}: ${pct(v)}\n${h(d)}"><text x="${L - 10}" y="${y + 15}" text-anchor="end" class="lbl-strong">${n}</text>
      ${v == null ? `<text x="${L + 6}" y="${y + 15}">No data</text>` : `<rect x="${L}" y="${y}" width="${Math.max(2, X(v) - L)}" height="22" rx="4" fill="var(--series-1)"/><text x="${X(v) + 8}" y="${y + 15}" class="lbl-strong">${pct(v)}</text>`}</g>`; }).join("")}
    <line x1="${X(fc.target)}" x2="${X(fc.target)}" y1="${T - 4}" y2="${T + rowH * 3}" stroke="var(--ink)" stroke-width="2"/>
    <text x="${X(fc.target)}" y="${H - 1}" text-anchor="middle" class="lbl-strong">Target ${pct(fc.target, 0)}</text>
  </svg>`;
  const st = v => v == null ? `<span class="pill">No data</span>` : v > fc.target + 0.01 ? `<span class="pill crit">Over target</span>` : v > fc.target ? `<span class="pill warn">Near target</span>` : `<span class="pill ok">On target</span>`;
  const gapTA = fc.actualPct != null && fc.theoPct != null ? fc.actualPct - fc.theoPct : null;
  const gapAP = fc.actualPct != null && fc.pnlPct != null ? fc.pnlPct - fc.actualPct : null;
  return head("Food cost", `${periodTxt(w)}Three views of the same period. Theoretical is what the recipes say it should cost, actual is what the counts say it did, and the P&L is what the books say.`) + `
  <section class="panel"><div style="overflow-x:auto">${svg}</div></section>
  <div class="tbl-wrap"><table><thead><tr><th>View</th><th class="n">Food cost %</th><th class="n">vs target</th><th>Status</th><th class="n">COGS</th><th class="n">Sales base</th></tr></thead><tbody>
    <tr><td>Theoretical</td><td class="n">${pct(fc.theoPct)}</td><td class="n">${fc.theoPct == null ? "–" : fmt((fc.theoPct - fc.target) * 100, 1) + " pts"}</td><td>${st(fc.theoPct)}</td><td class="n">${money(fc.theoCOGS)}</td><td class="n">${money(fc.mappedSales)}</td></tr>
    <tr><td>Actual</td><td class="n">${pct(fc.actualPct)}</td><td class="n">${fc.actualPct == null ? "–" : fmt((fc.actualPct - fc.target) * 100, 1) + " pts"}</td><td>${st(fc.actualPct)}</td><td class="n">${money(fc.actualCOGS)}</td><td class="n">${money(fc.mappedSales)}</td></tr>
    <tr><td>P&amp;L</td><td class="n">${pct(fc.pnlPct)}</td><td class="n">${fc.pnlPct == null ? "–" : fmt((fc.pnlPct - fc.target) * 100, 1) + " pts"}</td><td>${st(fc.pnlPct)}</td><td class="n">${money(num(w.pnl.foodCOGS))}</td><td class="n">${money(num(w.pnl.foodSales))}</td></tr>
  </tbody></table></div>
  <div class="grid2">
    <section class="panel"><h3>Theoretical → actual: ${gapTA == null ? "–" : fmt(gapTA * 100, 1) + " pts"}</h3><p class="muted">Usage the recipes don't explain: over-portioning, waste that wasn't logged, theft, or count errors. The Consumption view breaks it down by ingredient.</p></section>
    <section class="panel"><h3>Actual → P&amp;L: ${gapAP == null ? "–" : fmt(gapAP * 100, 1) + " pts"}</h3><p class="muted">Usually timing or coding: invoices booked to the wrong period or category, transfers not recorded, or non-food items in food COGS. Sales here use mapped menu items only${fc.sales > fc.mappedSales ? ` (${money(fc.sales - fc.mappedSales)} of POS sales are unmapped)` : ""}.</p></section>
  </div>`;
}

/* --- labor productivity --- */
function vLabor(w, A) {
  const Lb = A.labor;

/* ---------- import logic ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function autoMap(type, headers) {
  const map = {}, used = new Set(), H = headers.map(norm);
  for (const f of DATASETS[type].fields) {
    let best = null;
    for (const s of f.syn) { const i = H.findIndex((x, j) => !used.has(j) && x === s); if (i >= 0) { best = i; break; } }
    if (best == null) for (const s of f.syn) { const i = H.findIndex((x, j) => !used.has(j) && (x.includes(s) || (s.length > 3 && s.includes(x) && x.length > 2))); if (i >= 0) { best = i; break; } }
    if (best != null) { map[f.k] = best; used.add(best); }
  }
  return map;
}
function startImport(text, fileName) {
  const type = $("#imp_type")?.value || "sales";
  const rows = parseCSV(text);
  if (rows.length < 2) { toast("That file needs a header row and at least one data row."); return; }
  const headers = rows[0].map(x => x.trim());
  importState = { type, fileName, headers, rows: rows.slice(1), map: autoMap(type, headers) };
  render();
}
function ingByName(w, name, unit) {
  const n = norm(name); if (!n) return null;
  let i = w.ingredients.find(x => norm(x.name) === n);
  if (!i) { i = { id: uid("i_"), name: String(name).trim(), unit: unit || "ea", cat: "", cost: null }; w.ingredients.push(i); }
  return i;
}
function doImport() {
  const w = ws(), st = importState, m = st.map, g = (r, k) => m[k] != null ? r[m[k]] : undefined;
  let n = 0;
  if (st.type === "sales") {
    w.sales = st.rows.map(r => ({ item: String(g(r, "item") ?? "").trim(), qty: num(g(r, "qty")) || 0, revenue: num(g(r, "revenue")) || 0 })).filter(r => r.item);
    n = w.sales.length;
  } else if (st.type === "invoices") {
    w.invoices = st.rows.map(r => ({ date: String(g(r, "date") ?? "").trim(), vendor: String(g(r, "vendor") ?? "").trim(), desc: String(g(r, "desc") ?? "").trim(), qty: num(g(r, "qty")) || 0, packUnits: num(g(r, "packUnits")), packCost: num(g(r, "packCost")) })).filter(r => r.desc);
    w.invoices.forEach(l => { l.date = normDate(l.date); });
    n = w.invoices.length;
  } else if (st.type === "counts") {
    for (const r of st.rows) { const i = ingByName(w, g(r, "ingredient")); if (!i) continue; w.counts[i.id] = { begin: num(g(r, "begin")), end: num(g(r, "end")), waste: num(g(r, "waste")), transfer: num(g(r, "transfer")) }; n++; }
  } else if (st.type === "recipes") {
    const byName = {};
    for (const r of st.rows) {
      const rn = String(g(r, "recipe") ?? "").trim(); if (!rn) continue;
      const rec = byName[norm(rn)] ||= (() => { let x = w.recipes.find(y => norm(y.name) === norm(rn)); if (x) x.lines = []; else { x = { id: uid("r_"), name: rn, price: null, cat: "", yieldPct: 100, lines: [] }; w.recipes.push(x); } return x; })();
      const p = num(g(r, "price")); if (p != null) rec.price = p;
      const i = ingByName(w, g(r, "ingredient"), String(g(r, "unit") ?? "").trim() || undefined); if (!i) continue;
      rec.lines.push({ ing: i.id, qty: num(g(r, "qty")) || 0 }); n++;
    }
  } else if (st.type === "hourly") {
    w.hourly = st.rows.map(r => { let hr = String(g(r, "hour") ?? "").trim(); const pm = /p/i.test(hr), am = /a/i.test(hr); let x = parseInt(hr, 10); if (pm && x < 12) x += 12; if (am && x === 12) x = 0;
      return { hour: Number.isFinite(x) ? x : null, sales: num(g(r, "sales")) || 0, guests: num(g(r, "guests")) || 0, hours: num(g(r, "hours")) || 0, cost: num(g(r, "cost")) || 0 }; }).filter(r => r.hour != null);
    n = w.hourly.length;
  } else if (st.type === "ingredients") {
    for (const r of st.rows) { const i = ingByName(w, g(r, "name"), String(g(r, "unit") ?? "").trim() || undefined); if (!i) continue; const u = String(g(r, "unit") ?? "").trim(); if (u) i.unit = u; const c = num(g(r, "cost")); if (c != null) i.cost = c; const cat = String(g(r, "cat") ?? "").trim(); if (cat) i.cat = cat; n++; }
  }
  const label = DATASETS[st.type].label;
  importState = null; touch();
  subtab = st.type === "sales" ? "pos" : st.type === "invoices" ? "vendor" : st.type === "recipes" ? "recipes" : st.type === "ingredients" ? "ingredients" : "import";
  if (st.type === "hourly") location.hash = "productivity";
  render(); toast(`Imported ${fmt(n)} ${label.toLowerCase()}.`);
}
function normDate(s) {
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`; }
  return s;
}
async function claudeMatchColumns() {
  const st = importState, d = DATASETS[st.type];

  const prompt = `You map spreadsheet columns to fields for a restaurant food-cost tool.
Dataset: ${d.label}.
Fields (key: meaning): ${d.fields.map(f => `${f.k}: ${f.label}${f.req ? " (required)" : ""}`).join("; ")}.
Column headers, by index: ${st.headers.map((x, i) => `${i}=${JSON.stringify(x)}`).join(", ")}.
First rows: ${JSON.stringify(st.rows.slice(0, 3))}.
Return only a JSON object whose keys are the field keys and whose values are the matching column index (integer) or null if no column fits. Use each column at most once.`;
  try {
    const res = await sample.json(prompt, { modelTier: "quick" });
    const map = {};
    for (const f of d.fields) { const v = res?.[f.k]; if (Number.isInteger(v) && v >= 0 && v < st.headers.length) map[f.k] = v; }
    if (importState === st) { st.map = map; toast("Claude matched the columns. Check them before importing."); }
  } catch (e) { toast(sampleErr(e)); }
  st.busy = false; if (importState === st) render();
}
function sampleErr(e) {
