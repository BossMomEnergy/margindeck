}
function tokenScore(a, b) {
  const stop = new Set(["the", "and", "of", "w", "with", "lb", "oz", "ct", "cs", "case", "fresh", "frsh"]);
  const A = new Set(norm(a).split(" ").filter(t => t.length > 1 && !stop.has(t))), B = norm(b).split(" ").filter(t => t.length > 1 && !stop.has(t));
  let s = 0; for (const t of B) { for (const x of A) { if (x === t) s += 2; else if (x.length > 2 && t.length > 2 && (x.startsWith(t) || t.startsWith(x))) s += 1; } }
  return s;
}
function autoMatch(kind) {
  const w = ws(); let n = 0;
  if (kind === "pos") {
    for (const p of Object.keys(analyze(w).posAgg)) { if (w.posMap[p]) continue; let best = null, bs = 1; for (const r of w.recipes) { const s = tokenScore(p, r.name); if (s > bs) { bs = s; best = r.id; } } if (best) { w.posMap[p] = best; n++; } }
  } else {
    for (const desc of new Set(w.invoices.map(l => l.desc))) { if (w.vendorMap[desc]) continue; let best = null, bs = 1; for (const i of w.ingredients) { const s = tokenScore(desc, i.name); if (s > bs) { bs = s; best = i.id; } } if (best) { w.vendorMap[desc] = best; n++; } }
  }
  touch(); render(); toast(n ? `Matched ${n} by name. Check the matches.` : "No confident name matches. Try Suggest with Claude or map by hand.");
}
async function claudeMatch(kind) {
  const w = ws();
  const open = kind === "pos" ? Object.keys(analyze(w).posAgg).filter(p => !w.posMap[p]) : [...new Set(w.invoices.map(l => l.desc))].filter(d => !w.vendorMap[d]);
  if (!open.length) { toast("Everything is already mapped."); return; }
  const targets = kind === "pos" ? w.recipes.map(r => ({ id: r.id, name: r.name })) : w.ingredients.map(i => ({ id: i.id, name: i.name, unit: i.unit }));
  if (!targets.length) { toast(kind === "pos" ? "Add recipes first." : "Add ingredients first."); return; }
  toast("Asking Claude…");
  const prompt = `Match restaurant ${kind === "pos" ? "POS menu item names to recipes" : "distributor invoice descriptions to ingredients"}.
Names to match: ${JSON.stringify(open.slice(0, 120))}
Options (use the id): ${JSON.stringify(targets)}
Abbreviations are common (CHX = chicken, BRGR = burger, SHRD = shredded, # = pounds). Only match when you are confident; otherwise use null.${kind === "pos" ? ' Use "__skip" for items that are clearly not food (gift cards, merchandise, service charges).' : ""}
Return only a JSON object mapping each name exactly as given to an option id or null.`;
  try {
    const res = await sample.json(prompt, { modelTier: "default" });
    const ids = new Set(targets.map(t => t.id)); let n = 0;
    for (const name of open) { const v = res?.[name]; if (v && (ids.has(v) || (kind === "pos" && v === "__skip"))) { (kind === "pos" ? w.posMap : w.vendorMap)[name] = v; n++; } }
    touch(); render(); toast(n ? `Claude suggested ${n} matches. Check them.` : "Claude didn't find confident matches.");
  } catch (e) { toast(sampleErr(e)); }
}

/* ---------- readout & export ---------- */
async function draftReadout() {
  const w = ws(), A = analyze(w);
  readoutBusy = true; readoutAbort = new AbortController(); render();
  const facts = {
    client: w.name, period: w.setup.periodLabel || `${w.setup.periodDays} days`, targetFoodCost: pct(A.fc.target, 0),
    theoreticalFoodCost: pct(A.fc.theoPct), actualFoodCost: pct(A.fc.actualPct), pnlFoodCost: pct(A.fc.pnlPct),
    annualOpportunityTotal: money(A.opps.reduce((s, o) => s + o.value, 0)),
    opportunities: A.opps.slice(0, 8).map(o => ({ type: o.type, title: o.title, annual: money(o.value), detail: o.detail, nextStep: o.action })),
    menuDogs: A.review.dogs.map(x => x.r.name), puzzles: A.review.puzzles.map(x => x.r.name),
    stars: A.menu.filter(x => x.quad === "Star").map(x => x.r.name),
    salesPerLaborHour: money(A.labor.splh), laborPct: pct(A.labor.laborPct), primeCostPct: pct(A.labor.primePct),
    benchmarks: A.bench.filter(m => m.v != null).map(m => ({ metric: m.label, client: +m.v.toFixed(1), typical: m.typ, top20: m.top, status: m.status })), dataGaps: A.review.gaps.slice(0, 6).map(g => g.t)
  };
  const prompt = `You are a restaurant food-cost consultant writing a short readout for the owner of ${w.name}. Use only the facts below; don't invent numbers.
Facts: ${JSON.stringify(facts)}
Write 250-380 words in plain text (no markdown symbols). Sections with short plain headings on their own line: "Where you stand" (include how they compare with the top 20% of similar operators), "Biggest opportunities" (3-5 lines, each starting with the dollar figure per year), "Menu", "Next 30 days" (3-4 concrete actions), and "Data to tighten" only if there are data gaps. Direct, warm, no jargon, no hype. Annual figures are extrapolated from one period; say so once.`;
  try {
    const { text } = await sample(prompt, { signal: readoutAbort.signal, onText: ({ text }) => { const t = $("#readout"); if (t) t.value = text; } });
    w.readout = text; touch();
  } catch (e) {
    if (e?.text) { w.readout = e.text; touch(); }
    if (e?.code !== "cancelled") toast(sampleErr(e));
  }
  readoutBusy = false; readoutAbort = null; render();
}
function oppsCSV() {
  const w = ws(), A = analyze(w);
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["Rank", "Type", "Opportunity", "Annual value", "This period", "Detail", "Next step"].map(esc).join(",")];
  A.opps.forEach((o, i) => lines.push([i + 1, o.type, o.title, Math.round(o.value), Math.round(o.period), o.detail, o.action].map(esc).join(",")));
  return lines.join("\n");
}
async function exportCSV() {
  const w = ws(), csv = oppsCSV(), name = `${(w.name || "client").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-opportunities.csv`;
  if (downloads) {
    try { await downloads.save({ filename: name, data: csv }); return; }
    catch (e) { if (e?.code !== "unavailable") { if (e?.code === "declined" || e?.code === "cancelled") return; } }
  }
  try { await navigator.clipboard.writeText(csv); toast("Downloads aren't available here, so the CSV was copied to your clipboard."); }
  catch { toast("Couldn't save or copy the CSV in this view."); }
}

/* ---------- logo ---------- */
async function setLogo(file) {
  if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) { toast("Use a PNG, JPG, WebP or SVG image."); return; }
  if (file.size > 8 * 1024 * 1024) { toast("That image is over 8 MB. Use a smaller file."); return; }
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 320, sc = Math.min(1, max / Math.max(img.naturalWidth || max, img.naturalHeight || max));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round((img.naturalWidth || max) * sc)); c.height = Math.max(1, Math.round((img.naturalHeight || max) * sc));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    let data = c.toDataURL("image/webp", 0.9);
    if (!data.startsWith("data:image/webp")) data = c.toDataURL("image/png");
    if (data.length > 180000) { toast("That logo is too detailed to store. Try a simpler or smaller image."); return; }
    ws().logo = data; touch(); render(); renderLogo(); toast("Logo saved.");
  } catch { toast("Couldn't read that image. Try a PNG or JPG."); }
}
function renderLogo() { const el = $("#clientLogo"), w = ws(); if (w?.logo) { el.src = w.logo; el.alt = (w.name || "Client") + " logo"; el.hidden = false; } else { el.hidden = true; el.removeAttribute("src"); } }

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const sub = e.target.closest("[data-sub]");
  if (sub) { subtab = sub.dataset.sub; render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, w = ws();
  const rEl = b.closest("[data-rid]"), rec = rEl ? w.recipes.find(r => r.id === rEl.dataset.rid) : null;
  switch (act) {
    case "new-client": newClient(); break;
    case "delete-ask": confirmDelete = true; render(); break;
    case "delete-no": confirmDelete = false; render(); break;
    case "delete-yes": {
      const id = currentId;
      if (db && !id.startsWith("local_")) { try { await db.doc("clients/" + id).delete(); } catch (err) { toast("Couldn't delete this client."); return; } }
      delete clients[id]; if (localMode) saveLocal(); dirty = false; currentId = DEMO_ID; confirmDelete = false; renderClientSel(); renderSaveState(); render(); renderLogo(); toast("Client deleted."); break;
    }
    case "imp-paste": { const t = $("#imp_paste").value; if (t.trim()) startImport(t, "Pasted text"); else toast("Paste CSV text first."); break; }
    case "imp-cancel": importState = null; render(); break;
    case "imp-claude": claudeMatchColumns(); break;
    case "imp-go": doImport(); break;
    case "auto-pos": autoMatch("pos"); break;
    case "auto-ven": autoMatch("ven"); break;
    case "claude-pos": claudeMatch("pos"); break;
    case "claude-ven": claudeMatch("ven"); break;
    case "add-recipe": { w.recipes.unshift({ id: uid("r_"), name: "New recipe", price: null, cat: "", yieldPct: 100, lines: [], _open: true }); touch(); render(); break; }
    case "add-line": if (rec) { rec.lines.push({ ing: "", qty: 0 }); rec._open = true; touch(); render(); } break;
    case "del-line": if (rec) { rec.lines.splice(+b.dataset.i, 1); rec._open = true; touch(); render(); } break;
    case "del-recipe": if (rec) { w.recipes = w.recipes.filter(r => r !== rec); for (const k in w.posMap) if (w.posMap[k] === rec.id) delete w.posMap[k]; touch(); render(); } break;
    case "add-ing": w.ingredients.unshift({ id: uid("i_"), name: "New ingredient", unit: "ea", cat: "", cost: null }); touch(); render(); break;
    case "del-ing": {
      const id = b.closest("[data-iid]").dataset.iid;
      w.ingredients = w.ingredients.filter(i => i.id !== id); delete w.counts[id];
      for (const k in w.vendorMap) if (w.vendorMap[k] === id) delete w.vendorMap[k];
      w.recipes.forEach(r => r.lines = r.lines.filter(l => l.ing !== id)); touch(); render(); break;
    }
    case "draft": draftReadout(); break;
    case "draft-stop": readoutAbort?.abort(); break;
    case "copy-readout": { const t = $("#readout"); try { await navigator.clipboard.writeText(t.value); toast("Readout copied."); } catch { t.select(); toast("Text selected. Copy it with your keyboard."); } break; }
    case "export": exportCSV(); break;
    case "logo-remove": delete w.logo; touch(); render(); renderLogo(); break;
    case "goto-import": subtab = "import"; importState = null; pendingType = b.dataset.type; location.hash = "data"; break;
    case "bench-reset": w.bench = {}; touch(); render(); break;
    case "roll-ask": rollConfirm = true; render(); break;
    case "roll-no": rollConfirm = false; render(); break;
    case "roll-yes": rollPeriod(); break;
  }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.matches?.("details[data-rid]")) { const r = ws().recipes.find(x => x.id === d.dataset.rid); if (r) r._open = d.open; } }, true);
document.addEventListener("input", e => {
  const t = e.target, w = ws();
  if (t.dataset.count) {
    const c = w.counts[t.dataset.count] ||= {};
    c[t.dataset.cf] = t.value === "" ? null : num(t.value);
    const row = analyze(w).rows.find(r => r.ing.id === t.dataset.count);
    const cell = document.querySelector(`[data-actual="${CSS.escape(t.dataset.count)}"]`);
    if (cell) cell.textContent = row?.actual == null ? "–" : fmt(row.actual, 1);
    touch(); return;
  }
  if (t.id === "readout") { w.readout = t.value; touch(); return; }
  if (t.dataset.set === "name") { w.name = t.value; touch(); renderClientSel(); return; }
  if (t.dataset.acct) { w.account ||= {}; w.account[t.dataset.acct] = t.type === "number" ? num(t.value) : t.value; touch(); return; }
});
document.addEventListener("change", e => {
  const t = e.target, w = ws();
  if (t.id === "clientSel") { switchClient(t.value); return; }
  if (t.id === "logoFile") { const f = t.files[0]; if (f) setLogo(f); return; }
  if (t.id === "imp_file") { const f = t.files[0]; if (f) f.text().then(x => startImport(x, f.name)); return; }
  if (t.id === "imp_type") { pendingType = t.value; return; }
  if (t.dataset.check) { w.checklist ||= {}; w.checklist[t.dataset.check] = t.checked; touch(); render(); return; }
  if (t.dataset.bf) { const k = t.closest("[data-bk]").dataset.bk; w.bench ||= {}; const o = w.bench[k] ||= {}; o[t.dataset.bf] = num(t.value); touch(); render(); return; }
  if (t.dataset.map && importState) { importState.map[t.dataset.map] = t.value === "" ? null : +t.value; if (importState.map[t.dataset.map] == null) delete importState.map[t.dataset.map]; render(); return; }
  if (t.dataset.setup) { const k = t.dataset.setup; w.setup[k] = t.type === "number" ? num(t.value) : t.value; touch(); return; }
  if (t.dataset.pnl) { w.pnl[t.dataset.pnl] = num(t.value); touch(); return; }
  if (t.dataset.posmap != null) { if (t.value) w.posMap[t.dataset.posmap] = t.value; else delete w.posMap[t.dataset.posmap]; touch(); render(); return; }
  if (t.dataset.venmap != null) { if (t.value) w.vendorMap[t.dataset.venmap] = t.value; else delete w.vendorMap[t.dataset.venmap]; touch(); render(); return; }
  if (t.dataset.packunits != null) { const v = num(t.value); w.invoices.forEach(l => { if (l.desc === t.dataset.packunits) l.packUnits = v; }); touch(); return; }
  const rEl = t.closest("[data-rid]");
  if (rEl) {
    const r = w.recipes.find(x => x.id === rEl.dataset.rid); if (!r) return; r._open = true;
    if (t.dataset.rf) r[t.dataset.rf] = t.type === "number" ? num(t.value) : t.value;
    if (t.dataset.rl != null) { const l = r.lines[+t.dataset.rl]; l[t.dataset.rlf] = t.dataset.rlf === "qty" ? num(t.value) || 0 : t.value; }
    touch(); render(); return;
  }
  const iEl = t.closest("[data-iid]");
  if (iEl && t.dataset.if) { const i = w.ingredients.find(x => x.id === iEl.dataset.iid); if (i) { i[t.dataset.if] = t.dataset.if === "cost" ? num(t.value) : t.value; touch(); } return; }
});
document.addEventListener("dragover", e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) f.text().then(x => startImport(x, f.name)); });
$("#newClientBtn").addEventListener("click", newClient);
// tooltip
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
window.addEventListener("beforeunload", () => { if (dirty) saveNow(); });

/* ---------- boot ---------- */
readHash(); renderClientSel(); renderSaveState(); render(); renderLogo();
(async () => {
  if (!window.claude?.use) { localMode = true; loadLocal(); renderClientSel(); renderSaveState(); return; }
  claude.use("sample").then(s => { sample = s; if (["data", "readout"].includes(tab)) render(); });
  claude.use("downloads").then(d => { downloads = d; });
  db = await claude.use("db");
  if (!db) { renderSaveState(); return; }
  db.collection("clients").onSnapshot(snap => {
    const seen = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      const data = d.data(); if (!data) continue;
      const json = JSON.stringify(data);
      if (d.id === currentId && (dirty || saving)) continue;
      if (lastSavedJSON[d.id] === json && clients[d.id]) continue;
      clients[d.id] = upgrade(clone(data)); lastSavedJSON[d.id] = json;
      if (d.id === currentId && !document.activeElement?.matches("input,textarea,select")) { render(); renderLogo(); }
    }
    for (const id of Object.keys(clients)) if (!seen.has(id) && !id.startsWith("local_") && !snap.metadata.fromCache) { delete clients[id]; if (currentId === id) { currentId = DEMO_ID; render(); } }
    renderClientSel(); renderSaveState();
  }, err => { if (err?.code === "revoked") { db = null; renderSaveState(); } });
})();
</script>
